# Site settings
title: "Stories by Tom"
email: ""
description: "dinge, die mich bewegen - festgehalten auf analog film."
minimal_mistakes_skin: "default"
search: true

url: "https://storiesbytom.github.io"
baseurl: "/blog"

# Build settings
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes@4.28.1"

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

# WICHTIG: Kein include von _pages mehr!
include:
  - _data

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Author Settings
author:
  name: "Tom Stelzer"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "dinge, die mich bewegen - festgehalten auf analog film."
  links:
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/storiesbytom"

# Collections
collections:
  einblicke:
    output: true
    permalink: /einblicke/:path/
  projekte:
    output: true
    permalink: /projekte/:path/

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _einblicke
  - scope:
      path: ""
      type: einblicke
    values:
      layout: single
      author_profile: false
  # _projekte
  - scope:
      path: ""
      type: projekte
    values:
      layout: single
      author_profile: false

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
